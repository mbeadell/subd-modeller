      .map(line => line.slice(2).trim().split(/\s+/).map(Number));
    const points = lines.filter(line => !line.startsWith("# editor-state ") && !line.startsWith("c ") && (!explicit || !line.startsWith("q ")))
      .map(line => line.trim().split(/\s+/).map(Number));
    if (!(mm >= 1e-9 && mm <= 1e12) || points.length < 8 || points.length > (explicit ? 128 : 32) ||
        (!explicit && (points.length % 4 || (header !== "subd-sections 1" && points.length !== 8))) ||
        (quads && (quads.length < 6 || quads.length > 126 || quads.some(face => face.length !== 4 ||
          face.some(index => !Number.isInteger(index) || index < 0 || index >= points.length)))) ||
        points.some(point => point.length !== 3 || point.some(value => !(Math.abs(value) <= 1e12)))) {
      throw new Error("Invalid cage file");
    }
    if (loadedCreases.some(edge => ![2,3].includes(edge.length) ||
        (edge.length === 3 && !(edge[2] >= 0 && edge[2] <= 3)) || edge.slice(0,2).some(index =>
        !Number.isInteger(index) || index < 0 || index >= points.length) || edge[0] === edge[1])) {
      throw new Error("Invalid crease endpoints");
    }
    const editorState=parseEditorState(lines,points.length,loadedCreases.some(edge=>edge[2]!==0));
    // Verify mirror pairing before replacing the current document.
    let pairs=null;
    if(editorState.mirrored) {
      const previousPoints=cage, previousFaces=explicitFaces;
      try {
        cage=points; explicitFaces=quads;
        pairs=findMirrorPairs(editorState.mirrorAxis);
      } finally {
        cage=previousPoints; explicitFaces=previousFaces;
      }
      if(!pairs) throw new Error("Saved mirror plane does not match the cage");
      const locks=new Set(editorState.locks), targets=new Map(editorState.surfaceLocks);
      if(editorState.locks.some(index=>!locks.has(pairs[index])) ||
        editorState.surfaceLocks.some(([index,point])=>{
          const partner=targets.get(pairs[index]);
          return !partner || point.some((value,axis)=>
            Math.abs((axis===editorState.mirrorAxis?-value:value)-partner[axis])>1e-8);
        })) throw new Error("Saved locks do not match mirror symmetry");
    }
    if (drag) throw new Error("Finish dragging before opening a cage");
    if (documentSignature() !== savedDocument &&
        !window.confirm("Open this cage and replace your unsaved model?")) return;
    history.length = 0;
    future.length = 0;
    syncHistory();
    cage = points;
    mirrorAxis=editorState.mirrorAxis;
    mirrorPairs = pairs;
    syncMirrorButtons();
    lockedVertices=new Set(editorState.locks);
    surfaceLocks=new Map(editorState.surfaceLocks);
    explicitFaces = quads;
    creases = new Map(loadedCreases.filter(edge => edge[2] !== 0).map(([a,b,weight]) => [edgeKey(a,b),weight ?? Infinity]));
    width.value = mm;
    fileName.value = file.name.replace(/\.cage$/i, "");
    markSaved();
    selected = null;
    selectedVertices.clear();
    selectedFace = null;
    selectedLoop = null;
  selectedEdges.clear();
  selectedEdge = null;
    updateDimensions();
    draw();
    refresh();
  } catch (error) {
    status.textContent = error.message;
  } finally {
    input.value = "";
  }
};

saveDialog.onclose = async () => {
  if (saveDialog.returnValue !== "save" || !width.validity.valid || exporting) return;
  const kind = fileKind.value;
  if (kind === "cage") { saveCage(); return; }
  const name = fileName.value.trim() || "untitled";
  exporting = true;
  updateDimensions();
  try {
    const response = await fetch("/" + kind, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({points: cage, quads: explicitFaces, creases: creasePairs(), width: width.valueAsNumber, level: Number(document.querySelector("#mesh-level").value)})
    });
    if (!response.ok) throw new Error(response.status === 422
      ? (await response.text()).trim() : `Export failed (HTTP ${response.status})`);
    const blob = await response.blob();
    if (kind === "stl" && await checkStl(blob) &&
        !window.confirm("This STL contains intersecting triangles. Download anyway?")) return;
    download(blob, `${name}.${kind === "stl" ? "stl" : "step"}`);
  } catch (error) {
    status.textContent = error.message;
  } finally {
    exporting = false;
    updateDimensions();
  }
};
const recoveryKey = "subd-modeller-session-v1";
const dirtyIndicator = document.querySelector("#dirty-indicator");
let savedDocument = "";
let recoveryTimer;

function sessionDocument() {
  return {
    version:1, points:cage, faces:explicitFaces, width:Number(width.value),
    creases:creasePairs(), locks:[...lockedVertices], surfaceLocks:[...surfaceLocks],
    mirrorAxis, mirrored:!!mirrorPairs, name:fileName.value
  };
}

function documentSignature() {
  return JSON.stringify(sessionDocument());
}

function storeRecovery() {
  if (newPreview || !width.validity.valid) return;
  const signature = documentSignature();
  dirtyIndicator.hidden = signature === savedDocument;
  try {
    localStorage.setItem(recoveryKey, JSON.stringify({document:sessionDocument(), saved:savedDocument}));
  } catch {
    status.textContent = "Browser recovery storage unavailable. Save your cage to a file.";
  }
}

function scheduleRecovery() {
  if (newPreview) return;
  clearTimeout(recoveryTimer);
  recoveryTimer = setTimeout(storeRecovery, 200);
}

function markSaved() {
  savedDocument = documentSignature();
  storeRecovery();
}

function recoverSession() {
  try {
    const text=localStorage.getItem(recoveryKey);
    if (!text) return false;
    const {document:d,saved}=JSON.parse(text);
    const validIndex=i=>Number.isInteger(i)&&i>=0&&i<d.points.length;
    if (d.version!==1 || !Array.isArray(d.points) || d.points.length<8 || d.points.length>128 ||
      d.points.some(p=>!Array.isArray(p)||p.length!==3||p.some(v=>typeof v!=="number"||!Number.isFinite(v)||Math.abs(v)>1e12)) ||
      !(d.width>=1e-9&&d.width<=1e12) || ![0,1,2].includes(d.mirrorAxis) ||
      (d.faces!==null && (!Array.isArray(d.faces)||d.faces.length<6||d.faces.length>126||
        d.faces.some(f=>f.length!==4||!f.every(validIndex)))) ||
      (d.faces===null && (d.points.length>32||d.points.length%4)) ||
      !Array.isArray(d.creases)||!d.creases.every(e=>[2,3].includes(e.length)&&e.slice(0,2).every(validIndex)&&
        (e.length===2||(e[2]>0&&e[2]<=3))) ||
      !Array.isArray(d.locks)||!d.locks.every(validIndex) ||
      !Array.isArray(d.surfaceLocks)||!d.surfaceLocks.every(([i,p])=>validIndex(i)&&d.locks.includes(i)&&
        Array.isArray(p)&&p.length===3&&p.every(v=>typeof v==="number"&&Number.isFinite(v)))) {
      throw new Error("Invalid recovery data");
    }
    cage=d.points;
    explicitFaces=d.faces;
    width.value=d.width;
    creases=new Map(d.creases.map(([a,b,w])=>[edgeKey(a,b),w??Infinity]));
    lockedVertices=new Set(d.locks);
    surfaceLocks=new Map(d.surfaceLocks);
    mirrorAxis=d.mirrorAxis;
    mirrorPairs=d.mirrored?findMirrorPairs():null;
    syncMirrorButtons();
    fileName.value=typeof d.name==="string"?d.name:"untitled";
    savedDocument=typeof saved==="string"?saved:"";
    dirtyIndicator.hidden=documentSignature()===savedDocument;
    return true;
  } catch {
    status.textContent="The browser recovery copy could not be opened. Use File → Open.";
    return false;
  }
}

window.addEventListener("beforeunload", event=>{
  if (newPreview) {
    if (!dirtyIndicator.hidden) { event.preventDefault(); event.returnValue=""; }
    return;
  }
  storeRecovery();
  if(documentSignature()!==savedDocument) {
    event.preventDefault();
    event.returnValue="";
  }
});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden") storeRecovery();
});
width.addEventListener("change",storeRecovery);
const recovered=recoverSession();
if(!recovered) savedDocument=documentSignature();
new ResizeObserver(draw).observe(canvas);
refresh().then(()=>{
  if(recovered) status.textContent="Recovered your last browser session";
});

</script>
</html>
